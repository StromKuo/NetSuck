name: CI

# 只在「可能影响二进制」的改动上运行：Go 源码、依赖、构建产物配置。
# 文档（docs/、*.md）、CI 自身、仓库元文件的改动不会触发。
on:
  # main 分支的代码 push 由 release.yml 统一处理：它通过 workflow_call 调用本工作流，
  # 因此这里不再单独监听 main push，避免同一次提交跑两遍完整校验。
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'config.example.yaml'
      - 'Dockerfile'
      - '.dockerignore'
  # 供 release.yml 通过 workflow_call 复用，保证发版前一定跑过完整校验
  workflow_call:
  # 手动单独校验（不发版时排查用）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: Cross-compile (linux/amd64 + linux/arm64)
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/netsuck-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/netsuck-arm64 .
          file /tmp/netsuck-amd64 /tmp/netsuck-arm64

      - name: Version flag works
        env:
          CGO_ENABLED: '0'
        run: |
          go build -ldflags "-X main.buildVersion=ci-test" -o /tmp/netsuck-version .
          test "$(/tmp/netsuck-version -version)" = "netsuck ci-test"

      - name: Workflow YAML syntax
        run: |
          pip3 install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml, pathlib
          ok = True
          for p in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(p.read_text())
                  print(f"OK   {p}")
              except Exception as e:
                  ok = False
                  print(f"FAIL {p}: {e}")
          sys.exit(0 if ok else 1)
          PY

      # 发布编排的回归测试：步骤顺序（IMAGE_NAME 先于 metadata）、
      # metadata flavor（拒绝隐式 latest）、别名判定实时性、CI 触发去重
      - name: Release pipeline wiring tests
        run: |
          set -euo pipefail
          python3 .github/scripts/test_next_version.py
          python3 .github/scripts/test_alias_policy.py
          python3 .github/scripts/test_workflow_wiring.py
