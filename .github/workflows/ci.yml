name: CI

# 只在「可能影响二进制」的改动上运行：Go 源码、依赖、构建产物配置。
# 文档（docs/、*.md）、CI 自身、仓库元文件的改动不会触发。
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'config.example.yaml'
      - 'Dockerfile'
      - '.dockerignore'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'config.example.yaml'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: Cross-compile (linux/amd64 + linux/arm64)
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/netsuck-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/netsuck-arm64 .
          file /tmp/netsuck-amd64 /tmp/netsuck-arm64

      - name: Version flag works
        env:
          CGO_ENABLED: '0'
        run: |
          go build -ldflags "-X main.buildVersion=ci-test" -o /tmp/netsuck-version .
          test "$(/tmp/netsuck-version -version)" = "netsuck ci-test"
