name: Release

# 合入 main 时自动推算语义化版本：读自上一条 tag 以来的 commit message。
#   fix: / perf: / refactor:                 -> patch
#   feat:                                    -> minor
#   type!: 或 commit body 含 BREAKING CHANGE -> major
# 若没有可发布的改动（只有 docs/chore/test 等），则跳过发版。
# 也可以手动触发并指定升级类型（通过 tag-release.yml）。
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'config.example.yaml'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next semantic version
        id: bump
        run: |
          set -euo pipefail

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
            range=""
            echo "No previous tag; starting from $latest"
          else
            range="${latest}..HEAD"
            echo "Latest tag: $latest"
          fi

          if [ -n "$range" ]; then
            commits=$(git log "$range" --pretty=format:'%s%n%b%n---END---')
          else
            commits=$(git log --pretty=format:'%s%n%b%n---END---')
          fi

          bump="none"
          if printf '%s' "$commits" | grep -qE '^[a-zA-Z0-9_-]+(\(.*\))?!:|BREAKING CHANGE:'; then
            bump="major"
          elif printf '%s' "$commits" | grep -qE '^feat(\(.*\))?:'; then
            bump="minor"
          elif printf '%s' "$commits" | grep -qE '^(fix|perf|refactor)(\(.*\))?:'; then
            bump="patch"
          fi

          echo "Detected bump type: $bump"

          if [ "$bump" = "none" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy commits since $latest — skipping release."
            exit 0
          fi

          version="${latest#v}"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          echo "Next tag: $new_tag"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.bump.outputs.released == 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          set -euo pipefail
          gh release create "$NEW_TAG" \
            --title "$NEW_TAG" \
            --generate-notes \
            --verify-tag

  # 发版成功后构建并推送镜像（复用 tag 事件的工作流逻辑，单独成 job 以便失败可重跑）
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lower-case image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netsuck" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new_tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.new_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
