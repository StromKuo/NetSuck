name: Release

# 合入 main 时自动推算语义化版本并完整发布（校验 -> 打 tag -> Release -> 镜像）。
#
# 设计要点（对应 T16 审查发现的阻断项）：
# 1. 发版前强制跑完整校验（复用 ci.yml 的 verify），红灯不发版；
# 2. 唯一发布入口：手动发版也走这里（workflow_dispatch 带 bump 输入），避免
#    "手动只打 tag、GITHUB_TOKEN 推 tag 不触发后续 workflow"导致的漏发布；
# 3. 幂等恢复：若目标 commit 已有 tag 但 Release/镜像缺失，重跑会补齐而不是卡住；
# 4. 版本推算逻辑在 .github/scripts/next_version.py（有回归测试，规避 SIGPIPE）。
on:
  push:
    branches: [main]
    paths: &code_paths
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'config.example.yaml'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      bump:
        description: '手动强制升级类型（留空则按 commit 自动推断）'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: write
  packages: write

# 自动与手动发版共享同一把锁，防止两方从同一个 latest 算出同一个 tag 互相抢占
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 发版前必须通过的校验（失败则整个发布链中止）
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.plan.outputs.released }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Plan release (idempotent)
        id: plan
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # 幂等恢复：该 commit 若已带稳定版本 tag，直接沿用（补建 Release/镜像）
          existing=$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "${existing:-}" ]; then
            echo "Commit $sha already tagged $existing — resuming publication."
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, ".github/scripts")
          from next_version import latest_stable_tag
          print(latest_stable_tag() or "")
          PY
          )

          if [ -n "${BUMP_INPUT:-}" ] && [ "${BUMP_INPUT}" != "auto" ]; then
            if [ -z "$latest" ]; then
              echo "::error::manual bump requires an existing stable tag as base"
              exit 1
            fi
            tag=$(python3 - "$latest" "$BUMP_INPUT" <<'PY'
          import sys
          sys.path.insert(0, ".github/scripts")
          from next_version import bump_version
          print(bump_version(sys.argv[1], sys.argv[2]))
          PY
            )
          else
            result=$(python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, ".github/scripts")
          from next_version import classify, parse_commits, latest_stable_tag, bump_version
          latest = latest_stable_tag()
          rng = f"{latest}..HEAD" if latest else "HEAD"
          raw = subprocess.run(["git","log",rng,"--pretty=format:%s%n%b%x00"],
                               check=True, capture_output=True, text=True).stdout
          bump = classify(parse_commits(raw))
          if bump == "none":
              print("none")
          else:
              print(bump_version(latest, bump))
          PY
            )
            if [ "$result" = "none" ]; then
              echo "No release-worthy commits (no feat/fix/perf/refactor/breaking)."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="$result"
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists but not at HEAD; refusing to move it"
            exit 1
          fi

          echo "Planned tag: $tag at $sha"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run version classifier tests
        if: steps.plan.outputs.released == 'true'
        run: python3 .github/scripts/test_next_version.py

      - name: Create and push tag
        if: steps.plan.outputs.released == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release (idempotent)
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Set lower-case image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netsuck" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
